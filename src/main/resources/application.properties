spring.application.name=ellenco

# ==================================================
# SERVIDOR
# ==================================================
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true

# Sessao
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==================================================
# BANCO DE DADOS POSTGRESQL
# ==================================================
# Localmente, utiliza PostgreSQL na porta 5432.
# No Render, DB_URL recebe a URL do banco hospedado.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

#spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ==================================================
# RESEND - ENVIO DE EMAIL
# ==================================================
resend.api.key=${RESEND_API_KEY}
resend.api.url=https://api.resend.com/emails
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from.name=Sistema Ellenco

# ==================================================
# UPLOAD DE FOTOS E ARQUIVOS
# ==================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# ==================================================
# URL PUBLICA DO SISTEMA
# ==================================================
app.base-url=${APP_BASE_URL:http://localhost:8080}
