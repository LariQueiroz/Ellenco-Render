<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ellenco - Relatório Semanal</title>

<link rel="icon" href="img/logo-ellenco.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/tema.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: "class",
theme: {
extend: {
colors: {
ellenco: "#08088F"
}
}
}
}
</script>
</head>

<body class="bg-gray-50 min-h-screen">


<div class="flex min-h-screen">




<aside id="sidebar"></aside>



<!-- ==========================================
CONTEÚDO
========================================== -->

<main class="flex-1 min-w-0 p-4 md:p-8">


<div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-sm">


<!-- CABEÇALHO -->

<div class="flex justify-between items-start border-b pb-5">

    <div>

        <h1 class="text-2xl font-bold text-gray-800">

            Relatório Semanal

        </h1>


        <p
            id="nomeObra"
            class="text-gray-600 mt-1"
        >
            Carregando obra...
        </p>


        <p
            id="periodo"
            class="text-sm text-gray-500 mt-1"
        >
            Período
        </p>
        <div class="no-print flex flex-wrap items-center gap-2 mt-4">
            <select id="selObra" class="border rounded-lg px-3 py-2 text-sm max-w-[240px]" aria-label="Obra"></select>
            <button type="button" id="btnAnterior" class="border rounded-lg px-3 py-2 text-sm" aria-label="Semana anterior">◀ Semana anterior</button>
            <button type="button" id="btnProxima" class="border rounded-lg px-3 py-2 text-sm" aria-label="Próxima semana">Próxima semana ▶</button>
            <button type="button" id="btnHoje" class="border rounded-lg px-3 py-2 text-sm">Semana atual</button>
        </div>


    </div>


    <div class="flex gap-3">

        <button
            onclick="window.print()"
            class="bg-[#08088F] text-white px-5 py-2 rounded-lg hover:bg-blue-800"
        >
            🖨️ Imprimir / PDF
        </button>


        <button
            onclick="voltarRegistro()"
            class="border px-5 py-2 rounded-lg"
        >
            Voltar
        </button>

    </div>

</div>



<!-- ==========================================
RESUMO + PROGRESSO
========================================== -->

<div class="grid md:grid-cols-2 gap-6 mt-6">


<!-- RESUMO -->

<div class="border rounded-xl p-5">

    <h2 class="font-bold text-lg mb-3">

        1. Resumo Executivo

    </h2>


    <div id="resumo"
        class="text-gray-700 leading-relaxed"
    >
        Carregando resumo...
    </div>

</div>



<!-- PROGRESSO -->

<div class="border rounded-xl p-5">

    <h2 class="font-bold text-lg mb-4">

        Progresso da Obra

    </h2>


    <div class="flex items-center gap-4">

        <div class="flex-1">

            <div
                class="h-4 bg-gray-200 rounded-full overflow-hidden"
            >

                <div
                    id="barraProgresso"
                    class="h-full bg-[#08088F]"
                    style="width: 0%"
                ></div>

            </div>

        </div>


        <strong
            id="porcentagem"
            class="text-lg"
        >
            --
        </strong>

    </div>


    <p id="variacao" class="text-xs text-gray-500 mt-2"></p>
    <div class="grid grid-cols-2 gap-4 mt-5">

        <div>

            <p class="text-gray-500 text-sm">
                Dias trabalhados
            </p>

            <strong
                id="diasTrabalhados"
                class="text-xl"
            >
                0
            </strong>

        </div>


        <div>

            <p class="text-gray-500 text-sm">
                Registros realizados
            </p>

            <strong
                id="quantidadeRegistros"
                class="text-xl"
            >
                0
            </strong>

        </div>

    </div>

</div>

</div>



<!-- ==========================================
REGISTROS
========================================== -->

<div class="border-t mt-8 pt-6">

    <h2 class="font-bold text-lg mb-5">

        2. Registros da semana

    </h2>


    <div
        id="registrosSemana"
        class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4"
    >

    </div>

</div>



<!-- ==========================================
EVOLUÇÃO
========================================== -->

<div class="border-t mt-8 pt-6">

    <h2 class="font-bold text-lg mb-5">

        3. Evolução da Obra

    </h2>


    <div
        id="evolucao"
        class="grid grid-cols-1 md:grid-cols-3 gap-5"
    >

    </div>

</div>



<!-- ==========================================
RODAPÉ
========================================== -->

<div class="border-t mt-8 pt-5">

    <div class="flex justify-between">

        <div>

            <p class="text-sm text-gray-500">
                Responsável Técnico
            </p>

            <strong id="responsavel">Responsável pela obra</strong>

        </div>


        <div>

            <p class="text-sm text-gray-500">
                Data de Emissão
            </p>

            <strong id="dataEmissao">
                --
            </strong>

        </div>

    </div>

</div>


</div>

</main>

</div>


<script src="js/app.js"></script>
<script src="js/relatorio.js"></script>

</body>

</html>
