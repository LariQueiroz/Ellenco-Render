<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ellenco - Registro Diário</title>

<link rel="icon" href="img/logo-ellenco.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/tema.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: "class",
theme: {
extend: {
colors: {
ellenco: "#08088F"
}
}
}
}
</script>
</head>

<body class="bg-gray-50 min-h-screen">


<div class="flex min-h-screen">


<!-- ================= MENU ================= -->
<aside id="sidebar"></aside>


<!-- ================= CONTEÚDO ================= -->

<main class="flex-1 min-w-0 p-4 md:p-8">


<div class="max-w-5xl mx-auto">


<!-- TÍTULO -->

<div class="mb-6">

<h1
id="nomeObra"
class="text-2xl font-bold text-gray-800"
>
Registro diário da obra
</h1>

<p
id="localObra"
class="text-gray-500"
>
Carregando obra...
</p>

</div>


<!-- OBRA FINALIZADA -->

<div id="bannerFinalizada" class="hidden bg-green-50 border border-green-200 text-green-700 rounded-xl p-5 mb-6">
<p class="font-semibold">✅ Obra finalizada <span id="dataFinalizacao"></span></p>
<p class="text-sm mt-1">Não é possível lançar novos registros. Você ainda pode consultar o histórico e gerar o relatório semanal.</p>
<div class="flex flex-wrap gap-3 mt-4">
<button type="button" onclick="voltarObras()" class="border border-green-300 px-5 py-2 rounded-lg">Voltar</button>
<button type="button" onclick="elaborarRelatorio()" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700">Elaborar relatório</button>
<button type="button" onclick="reabrirObra()" class="border border-green-300 px-5 py-2 rounded-lg">Reabrir obra</button>
</div>
</div>


<!-- ================= DADOS ================= -->

<div id="cardForm" class="bg-white rounded-xl shadow-sm border p-6">


<h2 class="font-bold text-lg mb-5">
Informações do registro
</h2>


<div class="grid grid-cols-1 md:grid-cols-3 gap-5">


<!-- DATA -->

<div>

<label class="block text-sm font-medium mb-2">
Data
</label>

<input
type="date"
id="data"
class="w-full border rounded-lg px-3 py-2"
>

</div>



<!-- HORÁRIO -->

<div>

<label class="block text-sm font-medium mb-2">
Horário
</label>

<input
type="time"
id="horario"
class="w-full border rounded-lg px-3 py-2"
>

</div>



<!-- TURNO -->

<div>

<label class="block text-sm font-medium mb-2">
Turno
</label>

<select
id="turno"
class="w-full border rounded-lg px-3 py-2"
>

<option value="">
Selecione
</option>

<option value="Manhã">
Manhã
</option>

<option value="Tarde">
Tarde
</option>

<option value="Noite">
Noite
</option>

</select>

</div>



<!-- CLIMA -->

<div>

<label class="block text-sm font-medium mb-2">
Clima
</label>

<select
id="clima"
class="w-full border rounded-lg px-3 py-2"
>

<option value="">
Selecione
</option>

<option value="Ensolarado">
Ensolarado
</option>

<option value="Nublado">
Nublado
</option>

<option value="Chuvoso">
Chuvoso
</option>

<option value="Parcialmente nublado">
Parcialmente nublado
</option>

</select>

</div>



<!-- PROGRESSO -->

<div>

<label class="block text-sm font-medium mb-2">
Progresso da obra (%)
</label>

<input
type="number"
id="progresso"
min="0"
max="100"
step="1"
inputmode="numeric"
placeholder="Ex.: 45"
class="w-full border rounded-lg px-3 py-2"
>

</div>


</div>



<!-- ================= FOTOS ================= -->

<div class="mt-8">

<h2 class="font-bold text-lg mb-3">
Adicionar fotos
</h2>


<input
type="file"
id="fotos"
accept="image/*"
multiple
class="w-full border rounded-lg p-3"
>

<p id="infoFotos" class="text-sm text-gray-500 mt-2"></p>

<div
id="previewFotos"
class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"
>
</div>

</div>



<!-- ================= RELATO ================= -->

<div class="mt-8">

<label class="block font-bold mb-2">
Relato do dia
</label>

<textarea
id="descricao"
rows="5"
placeholder="Descreva as atividades realizadas na obra..."
class="w-full border rounded-lg p-3 resize-none"
></textarea>

</div>



<!-- ================= LOCALIZAÇÃO ================= -->

<div class="mt-8">

<h2 class="font-bold text-lg mb-3">
Localização (Georreferenciada)
</h2>


<div class="flex flex-col sm:flex-row gap-3">


<input
type="text"
id="localizacao"
readonly
placeholder="Clique em obter localização"
class="flex-1 border rounded-lg px-3 py-2 bg-gray-50"
>


<button
type="button"
id="btnLocalizacao"
onclick="obterLocalizacao()"
class="bg-[#08088F] text-white px-5 py-2 rounded-lg hover:bg-blue-800"
>
📍 Obter localização
</button>

</div>


<p
id="statusLocalizacao"
class="text-sm text-gray-500 mt-2"
></p>

</div>



<!-- ================= BOTÕES ================= -->

<div class="flex flex-wrap justify-end gap-3 mt-8">


<button
type="button"
onclick="voltarObras()"
class="border px-6 py-2 rounded-lg"
>
Voltar
</button>


<button
type="button"
onclick="finalizarObra()"
class="border border-red-300 text-red-600 px-6 py-2 rounded-lg hover:bg-red-50"
>
Finalizar obra
</button>


<button
type="button"
id="btnSalvar"
onclick="salvarRegistro()"
class="bg-[#08088F] text-white px-6 py-2 rounded-lg hover:bg-blue-800"
>
Salvar registro
</button>


<button
type="button"
onclick="elaborarRelatorio()"
class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700"
>
Elaborar relatório
</button>

</div>

</div>


<!-- ================= HISTÓRICO ================= -->

<div class="bg-white rounded-xl shadow-sm border p-6 mt-6">

<div class="flex justify-between items-center mb-5">
<h2 class="font-bold text-lg">Registros desta obra</h2>
<span id="totalRegistros" class="text-sm text-gray-500"></span>
</div>

<div id="historico" class="space-y-4">
<p class="text-gray-500 text-sm">Carregando registros...</p>
</div>

</div>

</div>

</main>

</div>

<script src="js/app.js"></script>
<script src="js/registro.js"></script>


</body>
</html>
