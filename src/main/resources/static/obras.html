<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ellenco - Obras</title>

<link rel="icon" href="img/logo-ellenco.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/tema.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: "class",
theme: {
extend: {
colors: {
ellenco: "#08088F"
}
}
}
}
</script>
</head>

<body class="bg-gray-50 min-h-screen">

<div class="flex min-h-screen">

<!-- ================= MENU LATERAL (gerado por js/app.js) ================= -->
<aside id="sidebar"></aside>


<!-- ================= CONTEÚDO ================= -->
<main class="flex-1 min-w-0 p-4 md:p-8">

<!-- CABEÇALHO -->
<div class="flex flex-wrap justify-between items-center gap-4 mb-6">

<div>
<h1 class="text-2xl font-bold text-gray-800">
Obras
</h1>

<p class="text-gray-500 mt-1">
Selecione uma obra para visualizar os registros e adicionar informações.
</p>
</div>

<div class="flex items-center gap-4">

<button
type="button"
id="btnNovaObra"
class="bg-[#08088F] hover:bg-blue-800 text-white px-5 py-2.5 rounded-lg transition"
>
＋ Nova obra
</button>

<div class="flex items-center gap-3">

<div class="text-right">
<p class="font-semibold text-gray-800" data-user-nome>&nbsp;</p>
<p class="text-xs text-gray-500" data-user-cargo></p>
</div>

<div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
👤
</div>

</div>

</div>

</div>

<!-- FILTROS -->
<div id="filtros" class="flex flex-wrap gap-2 mb-6">
<button type="button" data-filtro="TODAS" class="px-4 py-1.5 rounded-full text-sm border">Todas</button>
<button type="button" data-filtro="EM_ANDAMENTO" class="px-4 py-1.5 rounded-full text-sm border">Em andamento</button>
<button type="button" data-filtro="FINALIZADA" class="px-4 py-1.5 rounded-full text-sm border">Finalizadas</button>
</div>


<!-- ================= LISTA DE OBRAS ================= -->

<div
id="listaObras"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
>
<div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
<div class="skeleton h-40"></div>
<div class="p-5 space-y-3"><div class="skeleton h-4 w-2/3 rounded"></div><div class="skeleton h-3 w-1/3 rounded"></div></div>
</div>
</div>

</main>

</div>


<!-- ================= MODAL: CADASTRO / EDIÇÃO DE OBRA ================= -->
<div id="modalObra" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 overflow-y-auto">

<form id="formObra" class="bg-white rounded-xl shadow-xl w-full max-w-xl p-6 my-auto">

<h2 id="tituloModal" class="font-bold text-lg mb-5">Nova obra</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-5">

<div class="md:col-span-2">
<label class="block text-sm font-medium mb-2" for="obraNome">Nome da obra *</label>
<input type="text" id="obraNome" required maxlength="255" placeholder="Ex.: Rua Jardim das Flores" class="w-full border rounded-lg px-3 py-2">
</div>

<div>
<label class="block text-sm font-medium mb-2" for="obraLocal">Localização</label>
<input type="text" id="obraLocal" maxlength="255" placeholder="Ex.: São Paulo - SP" class="w-full border rounded-lg px-3 py-2">
</div>

<div>
<label class="block text-sm font-medium mb-2" for="obraResp">Responsável técnico</label>
<input type="text" id="obraResp" maxlength="255" placeholder="Nome do responsável" class="w-full border rounded-lg px-3 py-2">
</div>

<div>
<label class="block text-sm font-medium mb-2" for="obraInicio">Data de início</label>
<input type="date" id="obraInicio" class="w-full border rounded-lg px-3 py-2">
</div>

<div>
<label class="block text-sm font-medium mb-2" for="obraPrevisao">Previsão de término</label>
<input type="date" id="obraPrevisao" class="w-full border rounded-lg px-3 py-2">
</div>

<div class="md:col-span-2">
<label class="block text-sm font-medium mb-2" for="obraDescricao">Descrição</label>
<textarea id="obraDescricao" rows="3" maxlength="5000" placeholder="Escopo, observações gerais..." class="w-full border rounded-lg p-3 resize-none"></textarea>
</div>

</div>

<div class="flex flex-wrap justify-between items-center gap-3 mt-7">

<button type="button" id="btnExcluirObra" class="hidden text-red-600 text-sm hover:underline">
Excluir obra
</button>

<div class="flex gap-3 ml-auto">
<button type="button" id="btnCancelarObra" class="border px-6 py-2 rounded-lg">Cancelar</button>
<button type="submit" id="btnSalvarObra" class="bg-[#08088F] text-white px-6 py-2 rounded-lg hover:bg-blue-800">Salvar obra</button>
</div>

</div>

</form>

</div>


<!-- JavaScript -->
<script src="js/app.js"></script>
<script src="js/obras.js"></script>

</body>
</html>
